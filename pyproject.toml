[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torchperf"
version = "0.1.0"
description = "Lightweight PyTorch execution analysis and performance observability"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ritwik Ghosal" }
]

[tool.setuptools.packages.find]
where = ["src"]
